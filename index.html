<script>
'use strict';
/* BOUNCE BANK — pixel idle coin bouncer. Single file, no assets.
   Reset save: open with #reset */
const W=180,STEP=1/120,G=500,KEY='bounceBank.v1';let H=320,EX=0;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');ctx.imageSmoothingEnabled=false;
const rnd=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>v<a?a:v>b?b:v;
function mk(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.imageSmoothingEnabled=false;return [c,x];}
const hsl=(h,s,l)=>`hsl(${((Math.round(h)%360)+360)%360},${s}%,${l}%)`;

/* ---------- 3x5 bitmap font ---------- */
const GL={'0':'111101101101111','1':'010110010010111','2':'111001111100111','3':'111001111001111','4':'101101111001001','5':'111100111001111','6':'111100111101111','7':'111001001010010','8':'111101111101111','9':'111101111001111',
A:'010101111101101',B:'110101110101110',C:'011100100100011',D:'110101101101110',E:'111100110100111',F:'111100110100100',G:'011100101101011',H:'101101111101101',I:'111010010010111',J:'001001001101010',K:'101101110101101',L:'100100100100111',M:'101111111101101',N:'110101101101101',O:'010101101101010',P:'110101110100100',Q:'010101101110011',R:'110101110101101',S:'011100010001110',T:'111010010010010',U:'101101101101111',V:'101101101101010',W:'101101111111101',X:'101101010101101',Y:'101101010010010',Z:'111001010100111',
'$':'.####'+'#.#..'+'.###.'+'..#.#'+'####.','+':'000010111010000','-':'000000111000000','/':'001001010100100','.':'000000000000010',',':'000000000010100',':':'000010000010000','!':'010010010000010','?':'111001010000010','%':'101001010100101','(':'001010010010001',')':'100010010010100','>':'100010001010100','<':'001010100010001','=':'000111000111000',' ':'000000000000000'};
const GK=Object.keys(GL),FI={},FW={};
// glyphs are 3x5 ('1'/'0') except a few 5x5 ('#'/'.'); atlas cell stride is 5
const on=c=>c==='1'||c==='#';
GK.forEach((ch,i)=>{FI[ch]=i*5;const g=GL[ch],gw=g.length/5;let mn=gw,mx=-1;for(let p=0;p<g.length;p++)if(on(g[p])){mn=Math.min(mn,p%gw);mx=Math.max(mx,p%gw);}FW[ch]='.,:!'.includes(ch)?[mn,mx-mn+1]:ch===' '?[0,2]:[0,gw];});
const FONT={};
function atlas(col){let a=FONT[col];if(a)return a;const [c,x]=mk(GK.length*5,5);x.fillStyle=col;GK.forEach(ch=>{const g=GL[ch],gw=g.length/5;for(let p=0;p<g.length;p++)if(on(g[p]))x.fillRect(FI[ch]+p%gw,(p/gw)|0,1,1);});return FONT[col]=c;}
function tw(s,sc=1){let w=0;for(const ch of s.toUpperCase())w+=((FW[ch]||FW[' '])[1]+1)*sc;return Math.max(0,w-sc);}
function tx(s,x,y,col,sc=1){const a=atlas(col);x=Math.round(x);y=Math.round(y);for(const ch of s.toUpperCase()){const f=FW[ch];if(!f){x+=3*sc;continue;}if(ch!==' ')ctx.drawImage(a,FI[ch]+f[0],0,f[1],5,x,y,f[1]*sc,5*sc);x+=(f[1]+1)*sc;}}
function txo(s,x,y,col,sc=1,oc='#0a0514'){for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++)if(dx||dy)tx(s,x+dx,y+dy,oc,sc);tx(s,x,y,col,sc);}
function txc(s,cx,y,col,sc=1,oc){const x=cx-tw(s,sc)/2;oc?txo(s,x,y,col,sc,oc):tx(s,x,y,col,sc);}
const rainbow=(o=0)=>hsl(Math.floor(time*8+o)*30,100,68);

/* ---------- data ---------- */
const EMB={hole:['.....','.###.','.#.#.','.###.','.....'],diamond:['..#..','.#.#.','#...#','.#.#.','..#..'],star:['..#..','.###.','#####','.###.','.#.#.'],gem:['.###.','#.#.#','#####','.###.','..#..'],flame:['..#..','.##..','.###.','#####','.###.'],bolt:['...##','..##.','.###.','.##..','##...'],moon:['.###.','##...','##...','##...','.###.'],crown:['.....','#.#.#','#####','#####','.....']};
const TIERS=[
 {n:'BRONZE',  v:1,   r:5,em:'hole',   fx:'dust',   tl:4, c:['#3d1a08','#8a4a1c','#c8772e','#eaa65e','#ffd9a8']},
 {n:'SILVER',  v:3,   r:5,em:'diamond',fx:'glint',  tl:5, c:['#262a38','#6f7891','#b4bdd2','#e1e7f2','#ffffff']},
 {n:'GOLD',    v:10,  r:6,em:'star',   fx:'sparkle',tl:6, c:['#4f2e00','#b07200','#f2b711','#ffe066','#fffbd0']},
 {n:'EMERALD', v:30,  r:6,em:'gem',    fx:'leaf',   tl:8, c:['#052e1a','#0e7a40','#21c46a','#7dffb0','#e0fff0']},
 {n:'RUBY',    v:100, r:7,em:'flame',  fx:'fire',   tl:6, c:['#3a030d','#951029','#ef284f','#ff8299','#ffe0e7']},
 {n:'SAPPHIRE',v:300, r:7,em:'bolt',   fx:'volt',   tl:8, c:['#06174a','#1846c4','#3a96ff','#98d2ff','#e8f7ff']},
 {n:'AMETHYST',v:1000,r:8,em:'moon',   fx:'void',   tl:9, c:['#1e053a','#5a199e','#a446f5','#d79bff','#f7e8ff']},
 {n:'PRISM',   v:3000,r:8,em:'crown',  fx:'prism',  tl:12,c:['#2a0f45','#7a3ab0','#ff7ad9','#fff07a','#ffffff'],prism:true}];
const MAXT=TIERS.length-1;
const PALS=[
 {bg1:[11,4,32], bg2:[52,12,78], neon:'#ff3fd8',neonD:'#6e1260',pad:'#3ff4ff',padD:'#127a8a',acc:'#ffe14d',sunA:[255,222,90], sunB:[255,46,136],city:'#12062a',win:'#ff8ae6',star:'#ffd6ff'},
 {bg1:[2,16,14],  bg2:[10,56,46], neon:'#6dff3f',neonD:'#1f6a12',pad:'#ff4ae8',padD:'#7a1468',acc:'#fff04a',sunA:[214,255,74], sunB:[42,255,193],city:'#03140f',win:'#9dff8a',star:'#dfffe8'},
 {bg1:[20,6,4],   bg2:[74,22,26], neon:'#ff8a2a',neonD:'#7a3510',pad:'#42d4ff',padD:'#145a7a',acc:'#ffe14d',sunA:[255,240,140],sunB:[255,70,40], city:'#170705',win:'#ffc06a',star:'#ffe8d0'},
 {bg1:[2,8,28],   bg2:[10,36,84], neon:'#4ad8ff',neonD:'#124a7a',pad:'#ffd84a',padD:'#7a5a12',acc:'#ff5ad8',sunA:[200,240,255],sunB:[80,120,255],city:'#030a1c',win:'#8ae0ff',star:'#e0f4ff'},
 {bg1:[16,2,10],  bg2:[64,6,36],  neon:'#ff2a5a',neonD:'#7a0a26',pad:'#ffffff',padD:'#7a7a8a',acc:'#ffd84a',sunA:[255,220,120],sunB:[200,20,80], city:'#12020a',win:'#ff7aa0',star:'#ffe0ea'}];
const GOALS=[1e3,2e4,4e5,8e6,1.5e8,1.5e9,1e10,5e10,2.5e11];
const goal=s=>s<=GOALS.length?GOALS[s-1]:GOALS[GOALS.length-1]*Math.pow(5,s-GOALS.length);
const mult=()=>Math.pow(2,stage-1);
const cap=()=>Math.min(30,8+2*(stage-1));
const coinCost=n=>Math.ceil(10*Math.pow(1.32,n-1)*Math.pow(2,stage-1));
const padCost=()=>Math.ceil(60*Math.pow(7,padCount-1));
const mergeCost=t=>Math.ceil(30*Math.pow(7,t)*Math.pow(1.5,stage-1));
const UNITS=['','K','M','B','T','AA','AB','AC','AD','AE','AF'];
function fmt(n){if(!isFinite(n))return 'MAX';if(n<1000)return String(Math.floor(n));let i=0;while(n>=1000&&i<UNITS.length-1){n/=1000;i++;}return (n<10?Math.floor(n*100)/100:n<100?Math.floor(n*10)/10:Math.floor(n))+UNITS[i];}

/* ---------- geometry ---------- */
const CX=90,CY=150;
const WALLS=[[12,26,12,74],[12,74,36,206],[36,206,48,218],[48,218,132,218],[132,218,144,206],[144,206,168,74],[168,74,168,26],[12,26,168,26]].map(([ax,ay,bx,by])=>{const L=Math.hypot(bx-ax,by-ay);let nx=(by-ay)/L,ny=-(bx-ax)/L;if((CX-(ax+bx)/2)*nx+(CY-(ay+by)/2)*ny<0){nx=-nx;ny=-ny;}return {ax,ay,bx,by,nx,ny,one:true};});
const BASKET=[[12,74],[36,206],[48,218],[132,218],[144,206],[168,74]];
function mkPad(kind,ax,ay,bx,by){const L=Math.hypot(bx-ax,by-ay),ux=(bx-ax)/L,uy=(by-ay)/L;let nx=uy,ny=-ux;
  if(kind==='float'){if(ny>0){nx=-nx;ny=-ny;}}else if((CX-(ax+bx)/2)*nx+(CY-(ay+by)/2)*ny<0){nx=-nx;ny=-ny;}
  const p={kind,face:{ax,ay,bx,by},nx,ny,flash:0,sq:0,born:0,mx:(ax+bx)/2,my:(ay+by)/2};
  if(kind==='float'){const o=1.5;p.seg={ax:ax-nx*o,ay:ay-ny*o,bx:bx-nx*o,by:by-ny*o,nx,ny,one:false};p.th=1.5;}
  else{p.seg={ax,ay,bx,by,nx,ny,one:true};p.th=0;}return p;}
function wallPad(side,t0,t1){const A=side<0?[12,74]:[168,74],B=side<0?[36,206]:[144,206],L=Math.hypot(B[0]-A[0],B[1]-A[1]),ux=(B[0]-A[0])/L,uy=(B[1]-A[1])/L;let nx=uy,ny=-ux;if((CX-A[0])*nx<0){nx=-nx;ny=-ny;}const I=5;
  return mkPad('wall',A[0]+ux*t0+nx*I,A[1]+uy*t0+ny*I,A[0]+ux*t1+nx*I,A[1]+uy*t1+ny*I);}
const PADS=[mkPad('floor',50,213,130,213),wallPad(-1,92,120),wallPad(1,92,120),mkPad('float',52,146,70,156),mkPad('float',110,156,128,146),wallPad(-1,54,82),wallPad(1,54,82),wallPad(-1,16,44),wallPad(1,16,44)];

/* ---------- state ---------- */
let PAL=PALS[0],BG,SUN,FG,SCAN,STARS=[];
let money=0,stage=1,stageEarned=0,padCount=1,best=0,ips=0,secAcc=0,secT=0,muted=false;
let coins=[],spawnQ=0,spawnCD=0.6,dispT=0,MERGES=[],shake=0,flash=0,time=0,shownMoney=0,saveT=0,hiddenAt=0;
const P=[],TX=[],BN=[],cardPress=[0,0,0],cardShake=[0,0,0];let hold=null,OFF=null;

/* ---------- sprites ---------- */
const SPIN=[1,0.92,0.71,0.38,0.06,0.38,0.71,0.92];
const SPR=[],AURA=[];
function buildCoin(ti){const T=TIERS[ti],r=T.r,S=2*r+3,o=r+1,R=r+0.5,em=EMB[T.em],frames=[];
  const emb=(x,y)=>y>=0&&y<5&&x>=0&&x<5&&em[y][x]==='#';
  for(let f=0;f<8;f++){const sx=SPIN[f],[c,x]=mk(S,S),hue0=f*45;
    const col=(k,dx,dy)=>{if(!T.prism)return T.c[k];const h=hue0+(dx+dy)*14;return k===0?'#2a0f45':k===4?'#ffffff':k===1?hsl(h,80,38):k===2?hsl(h,95,60):hsl(h,100,80);};
    if(sx<0.15){const w=r>=7?3:2,x0=o-(w>>1);for(let dy=-r;dy<=r;dy++)for(let i=0;i<w;i++){const e=dy===-r||dy===r||i===0||i===w-1;x.fillStyle=e?col(0,0,dy):(dy&1)?col(1,0,dy):col(3,0,dy);x.fillRect(x0+i,dy+o,1,1);}frames.push(c);continue;}
    const ins=(dx,dy,rr)=>(dx/(rr*sx))**2+(dy/rr)**2<=1;
    for(let dy=-o;dy<=o;dy++)for(let dx=-o;dx<=o;dx++){if(!ins(dx,dy,R))continue;let k;
      if(!ins(dx-1,dy,R)||!ins(dx+1,dy,R)||!ins(dx,dy-1,R)||!ins(dx,dy+1,R))k=0;
      else{const l=-(dx/(R*sx))*0.6-(dy/R)*0.8,inner=!ins(dx,dy,R-1.6);
        if(inner)k=l>0?3:1;else{k=l>0.5?3:l<-0.45?1:2;const ex=Math.round(dx/sx)+2,ey=dy+2;
          if(emb(ex,ey))k=1;else if(emb(ex,ey-1))k=4;else{const u=dx/(R*sx),v=dy/R;if(u>-0.62&&u<-0.25&&v>-0.66&&v<-0.3)k=4;}}}
      x.fillStyle=col(k,dx,dy);x.fillRect(dx+o,dy+o,1,1);}
    frames.push(c);}
  SPR[ti]=frames;
  const AR=r+7,AS=AR*2+1,[ac,ax]=mk(AS,AS);ax.fillStyle=T.prism?'#ffffff':T.c[3];
  for(let dy=-AR;dy<=AR;dy++)for(let dx=-AR;dx<=AR;dx++){const d=Math.hypot(dx,dy);let a=d<=r+2?0.55:d<=r+4?0.3:d<=r+6?((dx+dy)&1?0.16:0):0;if(!a)continue;ax.globalAlpha=a;ax.fillRect(dx+AR,dy+AR,1,1);}
  AURA[ti]=ac;}
TIERS.forEach((_,i)=>buildCoin(i));

function buildPadSprites(p){const {ax,ay,bx,by}=p.face,{nx,ny}=p,L=Math.hypot(bx-ax,by-ay),ux=(bx-ax)/L,uy=(by-ay)/L,pix=new Map();
  for(let s=0;s<=L;s+=0.34)for(let k=-2;k<=3;k++){const x=Math.round(ax+ux*s-nx*k),y=Math.round(ay+uy*s-ny*k),key=x+','+y,pr=k>=0?k:10-k,cur=pix.get(key);if(!cur||pr<cur.pr)pix.set(key,{x,y,k,s,pr});}
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;for(const q of pix.values()){x0=Math.min(x0,q.x);y0=Math.min(y0,q.y);x1=Math.max(x1,q.x);y1=Math.max(y1,q.y);}
  p.sx=x0;p.sy=y0;p.frames=[];
  for(let f=0;f<7;f++){const [c,x]=mk(x1-x0+1,y1-y0+1);
    for(const q of pix.values()){let col,a=1;const capd=q.s<1.2||q.s>L-1.2;
      if(q.k<0){col=PAL.pad;a=q.k===-1?0.35:0.14;}
      else if(q.k===3||(capd&&q.k>0))col='#0a0514';
      else if(q.k===0)col=f===6?'#ffffff':capd?PAL.padD:PAL.pad;
      else col=f===6?PAL.pad:((Math.floor(q.s+q.k*1.5+f)%6+6)%6<3?PAL.acc:'#1b0f2e');
      x.globalAlpha=a;x.fillStyle=col;x.fillRect(q.x-x0,q.y-y0,1,1);}
    p.frames.push(c);}}

function plot(x0,y0,x1,y1,fn){x0=Math.round(x0);y0=Math.round(y0);x1=Math.round(x1);y1=Math.round(y1);const dx=Math.abs(x1-x0),dy=-Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1;let e=dx+dy,g=0;for(;;){fn(x0,y0);if((x0===x1&&y0===y1)||++g>600)break;const e2=2*e;if(e2>=dy){e+=dy;x0+=sx;}if(e2<=dx){e+=dx;y0+=sy;}}}
function lineP(x0,y0,x1,y1){plot(x0,y0,x1,y1,(x,y)=>ctx.rect(x,y,1,1));}
function ringPx(cx,cy,R){if(R<1){ctx.fillRect(cx,cy,1,1);return;}let x=R,y=0,e=1-R;ctx.beginPath();while(x>=y){ctx.rect(cx+x,cy+y,1,1);ctx.rect(cx-x,cy+y,1,1);ctx.rect(cx+x,cy-y,1,1);ctx.rect(cx-x,cy-y,1,1);ctx.rect(cx+y,cy+x,1,1);ctx.rect(cx-y,cy+x,1,1);ctx.rect(cx+y,cy-x,1,1);ctx.rect(cx-y,cy-x,1,1);y++;if(e<0)e+=2*y+1;else{x--;e+=2*(y-x)+1;}}ctx.fill();}

/* ---------- scene (rebuilt per stage palette) ---------- */
const B4=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];
/* background gradient (ordered dithering) + stars, sized to the full screen height */
function buildBG(){const Pl=PAL,N=7;
  let [c,x]=mk(W,H);const im=x.createImageData(W,H),d=im.data;
  for(let y=0;y<H;y++){const t=clamp((y-24)/(212+EX),0,1);for(let xx=0;xx<W;xx++){const b=Math.min(N,Math.floor(t*N+B4[(y&3)*4+(xx&3)]/16)),k=b/N,i=(y*W+xx)*4;
    d[i]=Pl.bg1[0]+(Pl.bg2[0]-Pl.bg1[0])*k;d[i+1]=Pl.bg1[1]+(Pl.bg2[1]-Pl.bg1[1])*k;d[i+2]=Pl.bg1[2]+(Pl.bg2[2]-Pl.bg1[2])*k;d[i+3]=255;}}
  x.putImageData(im,0,0);STARS=[];
  for(let i=0;i<46;i++){const sx=Math.floor(rnd(2,178)),sy=Math.floor(rnd(26,150+EX));x.globalAlpha=rnd(0.25,0.7);x.fillStyle=Pl.star;x.fillRect(sx,sy,1,1);if(i<14)STARS.push({x:sx,y:sy,p:rnd(0,7),s:rnd(1.5,4)});}
  x.globalAlpha=1;BG=c;}
function buildScene(){const Pl=PAL;buildBG();
  // synth sun
  const R=38;let [c,x]=mk(R*2+1,R*2+1);
  for(let dy=-R;dy<=R;dy++)for(let dx=-R;dx<=R;dx++){if(dx*dx+dy*dy>R*R)continue;const t=(dy+R)/(2*R),b=Math.min(5,Math.floor(t*5+B4[((dy+R)&3)*4+((dx+R)&3)]/16)),k=b/5;
    x.fillStyle=`rgb(${Pl.sunA[0]+(Pl.sunB[0]-Pl.sunA[0])*k|0},${Pl.sunA[1]+(Pl.sunB[1]-Pl.sunA[1])*k|0},${Pl.sunA[2]+(Pl.sunB[2]-Pl.sunA[2])*k|0})`;x.fillRect(dx+R,dy+R,1,1);}
  SUN=c;
  // foreground: skyline + basket
  [c,x]=mk(W,H);
  const mixC=(a,b,k)=>`rgb(${a[0]+(b[0]-a[0])*k|0},${a[1]+(b[1]-a[1])*k|0},${a[2]+(b[2]-a[2])*k|0})`;
  for(const layer of [0,1]){let bx=-4;while(bx<W){const w=Math.floor(rnd(7,16)),h=Math.floor(layer?rnd(10,40):rnd(26,64)),top=236-h;
    x.fillStyle=layer?Pl.city:mixC(Pl.bg2,Pl.bg1,0.35);x.fillRect(bx,top,w,h);
    if(!layer&&Math.random()<0.4){x.fillRect(bx+(w>>1),top-4,1,4);}
    x.fillStyle=Pl.win;for(let wy=top+3;wy<234;wy+=3)for(let wx=bx+2;wx<bx+w-1;wx+=3)if(Math.random()<(layer?0.18:0.28)){x.globalAlpha=layer?0.55:0.3;x.fillRect(wx,wy,1,1);}
    x.globalAlpha=1;bx+=w+(layer?Math.floor(rnd(2,10)):0);}}
  x.beginPath();BASKET.forEach(([px,py],i)=>i?x.lineTo(px,py):x.moveTo(px,py));x.closePath();x.fillStyle='rgba(6,2,14,0.5)';x.fill();
  const brush=(b,col,a)=>{const [tc,tx2]=mk(W,H);tx2.fillStyle=col;for(let i=0;i<BASKET.length-1;i++)plot(BASKET[i][0],BASKET[i][1],BASKET[i+1][0],BASKET[i+1][1],(px,py)=>tx2.fillRect(px-(b>>1),py-(b>>1),b,b));x.globalAlpha=a;x.drawImage(tc,0,0);x.globalAlpha=1;};
  brush(11,Pl.neon,0.06);brush(8,Pl.neon,0.1);brush(6,Pl.neon,0.16);brush(5,'#0a0514',1);brush(3,Pl.neonD,1);brush(1,Pl.neon,1);
  for(let i=0;i<BASKET.length-1;i++){const [ax,ay]=BASKET[i],[bx2,by2]=BASKET[i+1],L=Math.hypot(bx2-ax,by2-ay);for(let s=8;s<L-4;s+=18){const px=Math.round(ax+(bx2-ax)*s/L),py=Math.round(ay+(by2-ay)*s/L);x.fillStyle='#ffffff';x.globalAlpha=0.7;x.fillRect(px,py,1,1);x.globalAlpha=1;}}
  for(const [ex,ey] of [[12,74],[168,74]]){x.fillStyle='#0a0514';x.fillRect(ex-4,ey-3,9,6);x.fillStyle=Pl.neonD;x.fillRect(ex-3,ey-2,7,4);x.fillStyle=Pl.neon;x.fillRect(ex-3,ey-2,7,1);x.fillStyle='#ffffff';x.fillRect(ex-2,ey-2,2,1);}
  FG=c;}

/* ---------- physics ---------- */
function segHit(c,s,th){const ex=s.bx-s.ax,ey=s.by-s.ay,L2=ex*ex+ey*ey;let t=((c.x-s.ax)*ex+(c.y-s.ay)*ey)/L2;const inner=t>0&&t<1;t=t<0?0:t>1?1:t;
  const px=s.ax+ex*t,py=s.ay+ey*t,dx=c.x-px,dy=c.y-py,R=c.r+th,d2=dx*dx+dy*dy;
  const behind=s.one&&inner&&(dx*s.nx+dy*s.ny)<0&&d2<(R+10)*(R+10);
  if(!behind&&d2>=R*R)return null;const d=Math.sqrt(d2);let nx,ny;
  if(behind||d<1e-4){nx=s.nx;ny=s.ny;}else{nx=dx/d;ny=dy/d;}
  c.x=px+nx*R;c.y=py+ny*R;return [nx,ny,px,py];}
function padHit(c,p,i,h){const [nx,ny,px,py]=h,vn=c.vx*nx+c.vy*ny;if(vn>=0)return;
  const L=rnd(300,380),tx=-ny,ty=nx,vt=c.vx*tx+c.vy*ty;
  if(p.kind==='floor'){c.vx=vt*0.35+(CX-c.x)*rnd(0.6,1.6)+rnd(-45,45);c.vy=-L;}
  else if(p.kind==='float'&&ny>0){c.vx-=2*vn*nx*0.9;c.vy-=2*vn*ny*0.9;}
  else{let dx=nx,dy=ny-0.55;const m=Math.hypot(dx,dy);dx/=m;dy/=m;c.vx=dx*L*0.95+rnd(-30,30);c.vy=dy*L;}
  p.flash=1;p.sq=1;c.sq=1;
  if(!c.landed){c.landed=true;impactFx(c);}
  if(c.lastPad===i&&time-c.lastPadT<0.12)return;c.lastPad=i;c.lastPadT=time;
  earn(c,px,py);bounceFx(c,px,py,nx,ny);SFX.bounce(c.tier);}
function physics(dt){
  for(const c of coins){if(c.merge)continue;c.vy+=G*dt;c.vx*=1-0.08*dt;c.x+=c.vx*dt;c.y+=c.vy*dt;
    for(const w of WALLS){const h=segHit(c,w,2.5);if(!h)continue;const [nx,ny]=h,vn=c.vx*nx+c.vy*ny;if(vn<0){const tx=-ny,ty=nx,vt=c.vx*tx+c.vy*ty,e=0.45;
      c.vx=-vn*e*nx+vt*0.985*tx;c.vy=-vn*e*ny+vt*0.985*ty;if(!c.landed&&-vn>150&&c.y>120){c.landed=true;impactFx(c);}}}
    for(let i=0;i<padCount;i++){const p=PADS[i],h=segHit(c,p.seg,p.th);if(h)padHit(c,p,i,h);}}
  for(let i=0;i<coins.length;i++){const a=coins[i];if(a.merge)continue;for(let j=i+1;j<coins.length;j++){const b=coins[j];if(b.merge)continue;
    const dx=b.x-a.x,dy=b.y-a.y,R=a.r+b.r,d2=dx*dx+dy*dy;if(d2>=R*R||d2<1e-6)continue;const d=Math.sqrt(d2),nx=dx/d,ny=dy/d,pen=R-d,ma=a.r*a.r,mb=b.r*b.r,tot=ma+mb;
    a.x-=nx*pen*mb/tot;a.y-=ny*pen*mb/tot;b.x+=nx*pen*ma/tot;b.y+=ny*pen*ma/tot;
    const rel=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;if(rel<0){const j2=-(1.8)*rel/(1/ma+1/mb);a.vx-=j2*nx/ma;a.vy-=j2*ny/ma;b.vx+=j2*nx/mb;b.vy+=j2*ny/mb;
      if(-rel>170&&Math.random()<0.5)part({x:a.x+nx*a.r,y:a.y+ny*a.r,kind:1,life:0.18,col:'#ffffff'});}}}
  for(const c of coins){const v=Math.hypot(c.vx,c.vy);if(v>560){c.vx*=560/v;c.vy*=560/v;}
    if(!isFinite(c.x+c.y+c.vx+c.vy)||c.x<0||c.x>W||c.y<-EX||c.y>232){Object.assign(c,{x:90,y:48,vx:rnd(-30,30),vy:40});}}}

function offers(){const n=coins.length+spawnQ,cp=cap(),maxP=padCount>=PADS.length,pc=maxP?Infinity:padCost(),cc=coinCost(n),mt=pairTier(),mc=mt>=0?mergeCost(mt):Infinity;
  return [{cost:pc,can:!maxP&&money>=pc,why:maxP?'max':'money',run:addPad,label:maxP?'MAX':null},
          {cost:cc,can:n<cp&&money>=cc,why:n>=cp?'full':'money',run:()=>{spawnQ++;},label:n>=cp?'FULL':null},
          {cost:mc,can:mt>=0&&money>=mc,why:mt<0?'none':'money',run:doMerge,label:mt<0?'NEED 2':null,tier:mt}];}
function act(i){OFF=offers();const o=OFF[i];
  if(!o.can){cardShake[i]=0.25;SFX.deny();if(o.why==='full')pop('FULL! MERGE',90,226,'#ff6a8a',1,1.1,-10);else if(o.why==='none')pop('NEED A PAIR',150,226,'#ff6a8a',1,1.1,-10);return false;}
  money-=o.cost;o.run();cardPress[i]=0.12;SFX.buy();spark(31+i*59,290,8,['#ffffff','#7dff9e','#2fbf5b'],70,{g:150});OFF=offers();return true;}
function addPad(){const p=PADS[padCount];padCount++;p.flash=1;p.born=0.6;
  for(let s=0;s<=1.001;s+=0.1){const x=p.face.ax+(p.face.bx-p.face.ax)*s,y=p.face.ay+(p.face.by-p.face.ay)*s;part({x,y,vx:p.nx*rnd(10,40)+rnd(-10,10),vy:p.ny*rnd(10,40)+rnd(-10,10),life:rnd(0.3,0.6),col:['#ffffff',PAL.pad,PAL.padD],kind:1,drag:2});}
  ring(p.mx,p.my,2,18,0.35,PAL.pad);pop('NEW PAD!',p.mx,p.my-10,PAL.pad,1,1);shake=Math.max(shake,1.5);}
function doMerge(){const t=pairTier();if(t<0)return;const pool=coins.filter(c=>!c.merge&&c.tier===t);
  let a=pool[0],b=pool[1],bd=1e9;for(let i=0;i<pool.length;i++)for(let j=i+1;j<pool.length;j++){const d=Math.hypot(pool[i].x-pool[j].x,pool[i].y-pool[j].y);if(d<bd){bd=d;a=pool[i];b=pool[j];}}
  a.merge=b.merge=true;const mx=clamp((a.x+b.x)/2,44,136),my=clamp((a.y+b.y)/2,90,186);
  MERGES.push({a,b,a0:{x:a.x,y:a.y},b0:{x:b.x,y:b.y},mx,my,t:0,tier:t});}
function finishMerge(m){coins.splice(coins.indexOf(m.a),1);coins.splice(coins.indexOf(m.b),1);const nt=m.tier+1,T=TIERS[nt],c=newCoin(nt,m.mx,m.my,rnd(-30,30),-220);c.landed=true;coins.push(c);
  ring(m.mx,m.my,2,26,0.45,T.prism?rainbow():T.c[3]);ring(m.mx,m.my,1,14,0.3,'#ffffff');
  for(let i=0;i<26;i++){const b=i/26*6.283,v=rnd(80,170);part({x:m.mx,y:m.my,vx:Math.cos(b)*v,vy:Math.sin(b)*v,g:80,drag:2.5,life:rnd(0.35,0.7),col:T.prism?hsl(i*14,100,65):['#ffffff',T.c[3],T.c[2]],sz:2,shrink:true});}
  for(let i=0;i<6;i++)part({x:m.mx+rnd(-14,14),y:m.my+rnd(-14,14),kind:1,life:rnd(0.4,0.7),col:'#ffffff'});
  flash=Math.max(flash,0.35);shake=Math.max(shake,2.5);SFX.merge();
  pop(T.n+'!',m.mx,m.my-16,T.prism?'rainbow':T.c[3],2,1.3,-12);
  if(nt>best){best=nt;banner([{s:'NEW COIN!',sc:1,col:PAL.acc},{s:T.n,sc:3,col:T.prism?'rainbow':T.c[3]},{s:'$'+fmt(T.v)+' PER BOUNCE',sc:1,col:'#5dff8a'}],2);}}

function stageUp(){stage++;stageEarned=0;applyPalette();flash=1;shake=3;

/* ---------- update ---------- */
function update(dt){time+=dt;
  if(spawnQ>0){spawnCD-=dt;if(spawnCD<=0){spawnCoin();spawnQ--;spawnCD=0.22;}}
  dispT=Math.max(0,dispT-dt);
  for(let k=MERGES.length-1;k>=0;k--){const m=MERGES[k];m.t+=dt;const q=Math.min(1,m.t/0.5),e=q*q,ang=e*Math.PI*1.3;
    for(const [c,p0] of [[m.a,m.a0],[m.b,m.b0]]){const rx=p0.x-m.mx,ry=p0.y-m.my,cs=Math.cos(ang),sn=Math.sin(ang);c.x=m.mx+(rx*cs-ry*sn)*(1-e);c.y=m.my+(rx*sn+ry*cs)*(1-e);c.vx=c.vy=0;c.ph+=dt*30;
      if(Math.random()<0.6)part({x:c.x+rnd(-3,3),y:c.y+rnd(-3,3),life:0.3,col:['#ffffff',TIERS[m.tier+1].c[3]],kind:Math.random()<0.3?1:0});}
    if(q>=1){MERGES.splice(k,1);finishMerge(m);}}
  for(const c of coins){const T=TIERS[c.tier],sp=Math.hypot(c.vx,c.vy);
    c.hist.push({x:c.x,y:c.y});if(c.hist.length>T.tl)c.hist.shift();
    c.ph+=dt*(5+sp/35);c.sq=Math.max(0,c.sq-dt*8);c.orb+=dt*4.5;
    if(!c.merge){c.still=sp<25?c.still+dt:0;if(c.still>1.5){c.vy=-260;c.vx=(CX-c.x)*2;c.still=0;}}
    const r=c.r;
    switch(T.fx){
     case 'glint':if(Math.random()<dt*2)part({x:c.x-r*0.4,y:c.y-r*0.5,kind:1,life:0.3,col:'#ffffff'});break;

  st=parseFloat(cs.getPropertyValue('--sat'))||0,sb=parseFloat(cs.getPropertyValue('--sab'))||0,aw=innerWidth,ah=innerHeight-st-sb,
  nh=coarse?Math.max(320,Math.round(W*ah/aw)):320;
  if(nh!==H){H=nh;EX=H-320;cv.height=H;ctx.imageSmoothingEnabled=false;WALLS[0].ay=WALLS[6].by=WALLS[7].ay=WALLS[7].by=26-EX;if(BG)buildBG();buildScan();}
  let s=Math.min(aw/W,ah/H);if(!coarse){s*=0.85;const d=s*dpr;s=(d>=1?Math.floor(d):d)/dpr;}
  cv.style.width=W*s+'px';cv.style.height=H*s+'px';cv.style.top=st+ah/2+'px';}
addEventListener('resize',resize);resize();

buildScan();

else grantOffline(away);

let last=performance.now(),acc=0;
function frame(now){let dt=clamp((now-last)/1000,0,0.25);last=now;/* rAF stamp can precede the script's performance.now() */acc+=dt;let n=0;while(acc>=STEP&&n<40){physics(STEP);acc-=STEP;n++;}if(n>=40)acc=0;update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
